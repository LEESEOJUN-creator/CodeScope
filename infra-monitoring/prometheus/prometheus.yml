# CodeScope 앱(호스트에서 ./gradlew bootRunLoadTest로 기동)의 /actuator/prometheus를 스크랩한다.
# 로컬 kind는 monitoring 프로파일과 8080 port-forward를 사용한다. loadtest에서도 지표를 제공한다.
global:
  # 왜 5초인가(기본 1분): 부하테스트는 2~5분 단위로 짧게 돌린다. 1분 간격이면
  #   테스트 하나에 점이 몇 개 안 찍혀 GC pause·대기열 스파이크가 묻힌다.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: codescope
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
