version: '3.8'

# 왜 postgres 서비스가 없는가(2026-08-16 정리): Day 1~6 로컬 개발 초기에는
# 여기서 postgres를 띄웠지만, Day 6~7부터 kind 클러스터의 postgres Pod로
# 완전히 대체됐다(port-forward로 localhost:5432 접속). 이 파일에 옛
# postgres 서비스가 남아있으면 "docker-compose up으로 DB를 띄우는 건가?"
# 하는 혼란만 준다 — 로컬 기동은 scripts/local-up.ps1 참고.
services:
  redis:
    image: redis:7
    container_name: codescope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes  # 데이터 영속성 활성화
    profiles:
      - redis  # docker compose --profile redis up 할 때만 실행

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: codescope-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    profiles:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: codescope-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    profiles:
      - kafka

volumes:
  redis-data: