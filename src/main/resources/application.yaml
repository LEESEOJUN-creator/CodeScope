spring:
  application:
    name: codescope

  threads:
    virtual:
      enabled: true

  # ──────────────────────────────────────
  # 스케줄러 스레드 풀
  # 왜 지금 1개(기본값)로도 안전한가:
  #   현재 @Scheduled는 CollectScheduler 하나뿐이고 fixedDelay를 쓴다.
  #   fixedDelay는 "이전 실행이 끝난 뒤" 간격을 재므로 자기 자신과 겹치지 않는다.
  #   즉 스레드가 1개여도 경합할 상대가 없다.
  # 왜 그럼에도 값을 명시해 두는가:
  #   기본 풀 크기 1은 "스케줄러가 하나일 때만" 안전하다. 스케줄러가 하나라도
  #   더 늘어나면, Kafka 장애로 CollectScheduler가 최대 3분간 스레드를 점유하는
  #   동안 다른 스케줄러가 통째로 밀린다(코드리뷰 G).
  #   2로 올려두면 그 시점에 설정을 다시 찾아 헤맬 필요가 없다.
  task:
    scheduling:
      pool:
        size: 2

  # ──────────────────────────────────────
  # GitHub OAuth2 로그인 설정
  # 왜: 서비스 정체성과 일치, 사용자 GitHub 데이터 활용 가능,
  #     비밀번호 직접 관리 불필요 (보안 위험 위임)
  # registration 이름은 반드시 'github' 고정
  #   → Spring Security 기본 콜백 경로 /login/oauth2/code/github와 일치해야 함
  # provider/redirect-uri는 Spring Security가 GitHub을 기본 지원하므로 미기재
  # 기본값 없이 ${GITHUB_CLIENT_ID}/${GITHUB_CLIENT_SECRET}만 참조
  #   → 환경변수 누락 시 기동 실패 (조용히 잘못된 값으로 뜨는 것 방지)
  # 실제 값은 .env(로컬) / K8s Secret(배포)에서만 주입
  # .oauth2Login() 활성화는 SecurityConfig 다음 단계에서 처리
  # ──────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

  # ──────────────────────────────────────
  # PostgreSQL 설정
  # 왜: GithubRepo, Topic, Issue 등 모든 도메인 데이터를 저장하는 메인 DB
  # 왜 PostgreSQL인가: pgvector 확장을 지원하는 DB 중 가장 널리 쓰임
  #                    벡터 유사도 검색을 별도 DB 없이 PostgreSQL 하나로 해결
  # Day 6~7에서 kind PostgreSQL Pod에 연결할 때 host/port 변경 예정
  # ──────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/codescope
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate: 스키마는 Flyway(V1__init.sql)가 관리하고, Hibernate는
      #   엔티티 매핑과 실제 테이블 구조가 일치하는지만 검증
      # 왜 create-drop에서 전환했는가:
      #   2주차 시점엔 테이블 8개(물리적으로는 repo_topic 포함 9개)와
      #   실 데이터가 쌓여 있어 스키마를 Flyway로 조기 캡처.
      #   이제부터 스키마 변경은 엔티티 수정 + 새 Vn__*.sql 마이그레이션
      #   파일 추가로 함께 진행 (V1__init.sql은 이후 수정 금지)
      ddl-auto: validate
    show-sql: true      # SQL 로그 출력 (왜: N+1 문제 직접 눈으로 확인하기 위함)
    properties:
      hibernate:
        format_sql: true  # SQL을 보기 좋게 포맷 (왜: 쿼리 분석할 때 가독성)
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # ──────────────────────────────────────
  # Redis 설정
  # 왜: 두 가지 목적
  #   1. 실시간 트렌드 랭킹 (Sorted Set - ZINCRBY/ZRANGE)
  #      → DB에서 매번 ORDER BY stars 쿼리 실행 시 데이터가 쌓일수록 느려짐
  #      → Redis는 인메모리라 수 ms 응답
  #   2. 중복 수집 방지 (setIfAbsent)
  #      → 같은 레포를 두 번 처리하면 안 됨
  #      → DB 조회로 중복 확인하면 race condition 발생 가능
  #      → setIfAbsent는 atomic 연산으로 중복 방지 보장
  # Day 11 Redis 연결 후 실제로 사용
  # ──────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ──────────────────────────────────────
  # Kafka 설정
  # 왜: GitHub README 임베딩 생성이 레포 1개당 약 3초 걸림
  #     레포 200개를 동기로 처리하면 10분 → 스케줄러 다음 사이클과 겹침
  #     Kafka로 수집 이벤트를 발행하면 즉시 응답하고
  #     Consumer가 백그라운드에서 임베딩 처리
  # 왜 @Async 대신 Kafka인가:
  #     @Async: JVM 스레드풀 → 앱 재시작 시 처리 중 작업 유실
  #     Kafka: 브로커에 메시지 영속 저장 → 재시작해도 이어서 처리 가능
  # ──────────────────────────────────────
  kafka:
    # 로컬(IntelliJ 직접 실행, kind 클러스터 바깥) 접속용 EXTERNAL 리스너(9094).
    # kafka-0.kafka-headless:9092(PLAINTEXT)는 클러스터 내부 DNS라 로컬 PC에서
    # 해석 불가(ConfigException: No resolvable bootstrap urls) → EXTERNAL로 전환.
    # kubectl port-forward svc/kafka-headless 9094:9094 가 켜져 있어야 함.
    # 배포용 Spring Boot Pod(클러스터 내부)는 이 값 대신 PLAINTEXT(9092)를 써야
    # 하므로, 실제 배포 시엔 프로파일별로 분리 필요 (지금은 로컬 개발 전용)
    bootstrap-servers: localhost:9094
    producer:
      # 왜 acks: all인가:
      #   0/1은 리더에만 쓰면 응답 → 리더 장애 시 메시지 유실 가능
      #   all은 ISR 전체 replica가 받아야 성공 응답 → 유실 방지
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: collect-group
      auto-offset-reset: earliest
      # 왜 enable-auto-commit: false인가:
      #   true면 메시지 받는 순간 커밋 → 처리 실패해도 커밋됨 → 메시지 유실
      #   false면 처리 완료 후 수동 커밋 → 실패 시 재처리 가능
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.codescope.kafka.dto
        spring.json.value.default.type: com.codescope.kafka.dto.CollectMessage

# ──────────────────────────────────────
# Swagger UI 설정
# 왜: REST API를 브라우저에서 바로 테스트 가능
#     코드 기반으로 API 문서 자동 생성 → 포트폴리오 README에 URL 링크 가능
#     Postman 없이 localhost:8080/swagger-ui.html 하나로 전체 API 확인
# ──────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# ──────────────────────────────────────
# Actuator 설정
# 왜: K8s에서 Pod 헬스체크에 사용
#     /actuator/health 엔드포인트로 Pod가 정상인지 확인
#     ArgoCD, K8s Liveness/Readiness Probe가 이 엔드포인트를 호출함
# ──────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info

# ──────────────────────────────────────
# GitHub API 설정
# 왜: CodeScope의 핵심 데이터 소스
#     토큰 없이 호출하면 Rate Limit 60회/시간
#     토큰 있으면 5000회/시간
# 왜 ${GITHUB_TOKEN} 형식인가:
#     실제 토큰 값을 yml에 직접 쓰면 Git에 올라가서 보안 사고 발생
#     환경변수 참조 방식으로 값을 주입받음
#     로컬: .env 파일 / 배포: K8s Secret
# ──────────────────────────────────────
github:
  token: ${GITHUB_TOKEN:your-token-here}
  api:
    base-url: https://api.github.com

# ──────────────────────────────────────
# LLM 설정
# 왜 Ollama와 OpenAI 둘 다 설정하는가:
#     개발 중: Ollama (로컬, 무료) → API 비용 없음
#     배포 시: OpenAI로 전환 → 더 좋은 품질
#     LlmClient 인터페이스로 구현체 분리 → 코드 변경 없이 전환 가능
# ──────────────────────────────────────
llm:
  ollama:
    base-url: http://localhost:11434
    # nomic-embed-text: 768차원. 비용 문제로 OpenAI 임베딩/생성 모두
    # 배제하고 로컬/배포 동일하게 이 모델 하나로 통일(Day 25 확정,
    # V3__change_embedding_to_vector.sql의 vector(768)과 차원 일치)
    embedding-model: nomic-embed-text
  openai:
    api-key: ${OPENAI_API_KEY:}

# ──────────────────────────────────────
# JWT 설정
# 왜 secret을 환경변수로 받는가:
#     서명 키가 코드/설정 파일에 노출되면 누구나 토큰을 위조 가능
#     로컬: .env 파일 / 배포: K8s Secret
# jwt.secret은 HS256 최소 요구사항(256bit)을 충족하는 Base64 문자열이어야 함
# access-expiration: 15분(900000ms), refresh-expiration: 2주(1209600000ms)
# ──────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  cookie-secure: ${JWT_COOKIE_SECURE:false}

# ──────────────────────────────────────
# SQL 로그 레벨
# 왜: show-sql: true는 Hibernate가 System.out으로 직접 출력해
#     SLF4J/Logback 로거를 거치지 않음 → 테스트 코드에서 로그를 캡처할 수 없음
#     org.hibernate.SQL을 DEBUG로 켜면 동일한 SQL이 Logback을 통해서도 나가
#     ListAppender 등으로 자동 검증 가능해짐
# org.hibernate.orm.jdbc.bind: TRACE는 "?" 바인드 파라미터에 실제로 어떤 값이
#     들어갔는지 콘솔에서 눈으로 확인하기 위함 (offset/limit 값 검증용)
# ──────────────────────────────────────
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE