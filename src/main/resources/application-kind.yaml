# ──────────────────────────────────────
# kind 프로파일 전용 설정
# 왜 이 파일이 필요한가:
#   application.yaml(공통) 위에 "kind 환경에서만 다른 값"을 얹는 파일.
#   공통 설정은 그대로 두고 환경별 차이만 이 파일에서 관리
# 현재 상태: kind 환경에서 실제로 달라지는 값이 아직 확정되지 않아
#   활성화 조건만 정의된 빈 오버라이드로 시작.
#   배포/연결 단계에서 값이 정해지는 대로 채워 넣을 예정
# ──────────────────────────────────────

spring:
  config:
    activate:
      on-profile: kind
