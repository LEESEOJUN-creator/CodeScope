apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  template:
    spec:
      containers:
        # redis는 인메모리 캐시라 지금 단계에서 데이터량이 적고,
        # postgres는 실제 도메인 데이터를 담당해 상대적으로 더 여유를 줌
        - name: redis
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
---
# kafka는 여기 두지 않음: 256Mi/512Mi로 배포했다가 OOMKilled(Exit Code 137,
# 약 15분 만에 발생) 실측 확인 후 base/kafka-statefulset.yaml에 768Mi/1.5Gi로
# 직접 명시함. 여기서 다시 낮은 값으로 패치하면 base 수정이 무의미해지므로
# kind overlay에서는 base 값을 그대로 사용
