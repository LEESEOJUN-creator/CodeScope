apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: codescope
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        # emptyDir: kind 클러스터를 자주 삭제/재생성하는 개발 단계라 영구 저장이 불필요.
        # 실제 데이터 보존이 필요해지면 PersistentVolumeClaim으로 전환 가능.
        - name: postgres-data
          emptyDir: {}
