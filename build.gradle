plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.codescope'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Web
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Spring Data Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Spring Kafka
	implementation 'org.springframework.kafka:spring-kafka'

	// Spring Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring Security + OAuth2 Client (GitHub OAuth)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Spring Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// WebFlux (WebClient - GitHub API, Ollama, OpenAI 호출용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway (스키마 버전 관리)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// QueryDSL (동적 검색 - Day 9에서 사용)
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// pgvector (벡터 유사도 검색 - Day 22에서 사용)
	implementation 'com.pgvector:pgvector:0.1.6'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'io.projectreactor:reactor-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL Q클래스 생성 경로
def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
	main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile) {
	options.annotationProcessorGeneratedSourcesDirectory = file(querydslDir)
}

tasks.named('test') {
	useJUnitPlatform()
}

// DbBackpressureLoadTest 전용 JFR 진단 태스크.
// jdk.VirtualThreadPinned 이벤트 관찰 목적 (pgjdbc synchronized 블록 pinning 확인).
// 별도 태스크로 분리해 기본 test 태스크(다른 모든 테스트)에는 영향 없음.
// 임시 진단용, 확인 끝나면 이 태스크는 제거 예정.
tasks.register('dbBackpressureJfrTest', Test) {
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching 'com.codescope.infra.config.DbBackpressureLoadTest'
	}
	// threshold=0ms: profile.jfc 기본값(20ms)으로는 짧은 pinning이 누락될 수 있어 하향 조정.
	jvmArgs(
		'-XX:StartFlightRecording=filename=build/pinning.jfr,settings=profile,jdk.VirtualThreadPinned#threshold=0ms',
		// application.yaml의 show-sql/org.hibernate.SQL 로깅(println/synchronized 경로)이
		// pinning 원인의 노이즈였는지 격리하기 위해, 이 태스크 실행 시점에만 System property로
		// 끈다. application.yaml(프로덕션 설정) 자체는 건드리지 않음.
		'-Dspring.jpa.show-sql=false',
		'-Dlogging.level.org.hibernate.SQL=WARN'
	)
}