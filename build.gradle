plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.codescope'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Web
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Spring Data Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Spring Kafka
	implementation 'org.springframework.kafka:spring-kafka'

	// Spring Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring Security + OAuth2 Client (GitHub OAuth)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Spring Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// WebFlux (WebClient - GitHub API, Ollama, OpenAI 호출용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway (스키마 버전 관리)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// QueryDSL (동적 검색 - Day 9에서 사용)
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// pgvector (벡터 유사도 검색 - Day 24에서 도입)
	implementation 'com.pgvector:pgvector:0.1.6'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'

	// Testcontainers: @DataJpaTest가 실제 개발/운영 PostgreSQL 대신
	// 테스트 전용 컨테이너를 쓰도록 하기 위함.
	// 왜 필요해졌는가: 수집 파이프라인이 돌기 시작하면서 로컬 테스트가 붙던
	//   PostgreSQL에 실제 GitHub 레포 데이터가 쌓였고, "픽스처만 있다"고
	//   가정하고 개수를 단언하던 테스트들이 깨졌다(expected: 3L but was: 34L).
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'io.projectreactor:reactor-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL Q클래스 생성 경로
def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
	main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile) {
	options.annotationProcessorGeneratedSourcesDirectory = file(querydslDir)
}

tasks.named('test') {
	// "load" 태그(현재는 DbBackpressureLoadTest)를 기본 test에서 제외한다.
	// 왜: 이 테스트는 가상 스레드 2000개를 띄우는 부하 테스트로, 과거 실측상
	//   세마포어 없는 케이스가 62.5초 걸렸다. 모든 PR에서 돌리면 CI가 느려지고
	//   러너 성능 편차 때문에 결과가 흔들린다(코드리뷰 F).
	//   부하 테스트는 "필요할 때 의도적으로" 돌리는 것이 맞다.
	useJUnitPlatform {
		excludeTags 'load'
	}

	// test 프로파일을 강제 활성화한다.
	// 왜: CollectScheduler에 @Profile("!test")를 걸어 테스트 중 스케줄러가
	//   실제 GitHub API를 호출하는 것을 막았는데(코드리뷰 E), 그 조건이
	//   걸리려면 test 프로파일이 실제로 켜져 있어야 한다.
	//   src/test/resources에 application.yml을 새로 두는 방식은
	//   main의 application.yaml과 로딩 우선순위가 얽혀 혼란스러우므로,
	//   테스트 실행 시점의 시스템 프로퍼티로 명시하는 쪽을 택했다.
	systemProperty 'spring.profiles.active', 'test'
}

// 부하 테스트만 따로 실행하는 태스크: ./gradlew loadTest
// 기본 test에서 제외했다고 실행 수단까지 없애면 안 되므로 별도 경로를 남겨둔다.
tasks.register('loadTest', Test) {
	useJUnitPlatform {
		includeTags 'load'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'spring.profiles.active', 'test'
}

// DbBackpressureLoadTest 전용 JFR 진단 태스크.
// jdk.VirtualThreadPinned 이벤트 관찰 목적 (pgjdbc synchronized 블록 pinning 확인).
// 별도 태스크로 분리해 기본 test 태스크(다른 모든 테스트)에는 영향 없음.
// 임시 진단용, 확인 끝나면 이 태스크는 제거 예정.
tasks.register('dbBackpressureJfrTest', Test) {
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching 'com.codescope.infra.config.DbBackpressureLoadTest'
	}
	// threshold=0ms: profile.jfc 기본값(20ms)으로는 짧은 pinning이 누락될 수 있어 하향 조정.
	jvmArgs(
		'-XX:StartFlightRecording=filename=build/pinning.jfr,settings=profile,jdk.VirtualThreadPinned#threshold=0ms',
		// application.yaml의 show-sql/org.hibernate.SQL 로깅(println/synchronized 경로)이
		// pinning 원인의 노이즈였는지 격리하기 위해, 이 태스크 실행 시점에만 System property로
		// 끈다. application.yaml(프로덕션 설정) 자체는 건드리지 않음.
		'-Dspring.jpa.show-sql=false',
		'-Dlogging.level.org.hibernate.SQL=WARN'
	)
}