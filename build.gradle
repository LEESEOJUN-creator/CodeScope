plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.codescope'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Web
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Spring Data Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Spring Kafka
	implementation 'org.springframework.kafka:spring-kafka'

	// Spring Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring Security + OAuth2 Client (GitHub OAuth)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Spring Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Prometheus 레지스트리: /actuator/prometheus로 JVM(힙/GC/스레드)·HikariCP·
	// HTTP 지표를 노출해 부하테스트 중 Grafana로 실시간 관찰한다
	// (infra-monitoring/docker-compose.yml의 prometheus가 스크랩).
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Anthropic Claude API 공식 Java SDK (텍스트 생성 - ClaudeLlmClient)
	implementation 'com.anthropic:anthropic-java:2.34.0'

	// WebFlux (WebClient - GitHub API, Ollama, OpenAI 호출용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway (스키마 버전 관리)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// QueryDSL (동적 검색 - Day 9에서 사용)
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// pgvector (벡터 유사도 검색 - Day 24에서 도입)
	implementation 'com.pgvector:pgvector:0.1.6'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'

	// Testcontainers: @DataJpaTest가 실제 개발/운영 PostgreSQL 대신
	// 테스트 전용 컨테이너를 쓰도록 하기 위함.
	// 왜 필요해졌는가: 수집 파이프라인이 돌기 시작하면서 로컬 테스트가 붙던
	//   PostgreSQL에 실제 GitHub 레포 데이터가 쌓였고, "픽스처만 있다"고
	//   가정하고 개수를 단언하던 테스트들이 깨졌다(expected: 3L but was: 34L).
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'io.projectreactor:reactor-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL Q클래스 생성 경로
def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
	main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile) {
	options.annotationProcessorGeneratedSourcesDirectory = file(querydslDir)
}

tasks.named('test') {
	// "load" 태그(현재는 DbBackpressureLoadTest)를 기본 test에서 제외한다.
	// 왜: 이 테스트는 가상 스레드 2000개를 띄우는 부하 테스트로, 과거 실측상
	//   세마포어 없는 케이스가 62.5초 걸렸다. 모든 PR에서 돌리면 CI가 느려지고
	//   러너 성능 편차 때문에 결과가 흔들린다(코드리뷰 F).
	//   부하 테스트는 "필요할 때 의도적으로" 돌리는 것이 맞다.
	useJUnitPlatform {
		// live: 실제 Claude API를 호출해 비용이 드는 테스트(./gradlew liveTest로만 실행)
		excludeTags 'load', 'live'
	}

	// test 프로파일을 강제 활성화한다.
	// 왜: CollectScheduler에 @Profile("!test")를 걸어 테스트 중 스케줄러가
	//   실제 GitHub API를 호출하는 것을 막았는데(코드리뷰 E), 그 조건이
	//   걸리려면 test 프로파일이 실제로 켜져 있어야 한다.
	//   src/test/resources에 application.yml을 새로 두는 방식은
	//   main의 application.yaml과 로딩 우선순위가 얽혀 혼란스러우므로,
	//   테스트 실행 시점의 시스템 프로퍼티로 명시하는 쪽을 택했다.
	systemProperty 'spring.profiles.active', 'test'

	// Kafka 리스너 자동 시작을 끈다(KafkaConsumerConfig 주석 참고).
	// 왜: @SpringBootTest 컨텍스트가 개발용 Kafka에 실제 앱과 같은 그룹 ID로 붙어
	//   개발 앱의 메시지를 가로채 처리했다. 컨슈머 로직은 Mockito 단위 테스트
	//   (CollectConsumerTest/EmbedConsumerTest)가 검증하므로 컨텍스트 테스트에서는
	//   리스너가 돌 필요가 없다. bootRunLoadTest(test 프로파일)에는 영향 없음 —
	//   이 값은 테스트 태스크에만 걸린다.
	systemProperty 'spring.kafka.listener.auto-startup', 'false'
}

// 부하 테스트만 따로 실행하는 태스크: ./gradlew loadTest
// 기본 test에서 제외했다고 실행 수단까지 없애면 안 되므로 별도 경로를 남겨둔다.
tasks.register('loadTest', Test) {
	useJUnitPlatform {
		includeTags 'load'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'spring.profiles.active', 'test'
}

// 실제 외부 API(Claude)를 호출하는 스모크 테스트만 실행: ANTHROPIC_API_KEY=... ./gradlew liveTest
// 키가 없으면 테스트가 스스로 스킵된다. 호출당 비용이 들어 기본 test·CI에서는 제외.
tasks.register('liveTest', Test) {
	useJUnitPlatform {
		includeTags 'live'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'spring.profiles.active', 'test'
	testLogging {
		showStandardStreams = true
	}
}

// 부하테스트용 앱 기동: ./gradlew bootRunLoadTest [-Pgc=zgc] [-Pheap=512m]
// test 프로파일(CollectScheduler 비활성 → 백그라운드 GitHub 수집이 지표를
// 흔들지 않음, /api/test/** 활성) + loadtest 프로파일(stub LLM, Prometheus
// 노출, SQL 로그 끔)로 뜨고, JFR 녹화와 GC 로그를 build/loadtest/에 남긴다.
// 가이드: docs/performance/loadtest-guide.md
tasks.register('bootRunLoadTest', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = '부하테스트용 기동(JFR + GC 로그 + Prometheus, stub LLM)'
	mainClass = 'com.codescope.CodescopeApplication'
	classpath = sourceSets.main.runtimeClasspath

	def outDir = layout.buildDirectory.dir('loadtest').get().asFile
	def stamp = new Date().format('yyyyMMdd-HHmmss')
	// 왜 -Xms=-Xmx로 고정하는가: 힙이 실행 중에 늘었다 줄었다 하면 GC 빈도·
	//   pause가 "부하" 때문인지 "힙 리사이징" 때문인지 구분이 안 된다.
	//   실험 간 비교(G1 vs ZGC, 세마포어 on/off)를 위해 힙 크기를 고정한다.
	def heap = project.findProperty('heap') ?: '512m'
	// JDK 21의 ZGC는 -XX:+ZGenerational을 줘야 세대별 ZGC로 동작한다(기본은 비세대).
	def gcFlags = (project.findProperty('gc') == 'zgc') ? ['-XX:+UseZGC', '-XX:+ZGenerational'] : ['-XX:+UseG1GC']
	def gcName = (project.findProperty('gc') == 'zgc') ? 'zgc' : 'g1'

	doFirst { outDir.mkdirs() }
	jvmArgs(gcFlags + [
		"-Xms${heap}", "-Xmx${heap}",
		// settings=profile: 할당 샘플링·락 경합·GC 단계까지 기록하는 상세 설정.
		// VirtualThreadPinned threshold=0ms는 dbBackpressureJfrTest와 동일한 이유(짧은 pinning 누락 방지).
		"-XX:StartFlightRecording=filename=${outDir}/app-${gcName}-${stamp}.jfr,settings=profile,dumponexit=true,jdk.VirtualThreadPinned#threshold=0ms",
		// 통합 로깅(-Xlog)으로 GC 이벤트 전체 + safepoint를 파일에 남긴다.
		// JFR과 별개로 남기는 이유: GC 로그는 GCeasy 같은 외부 분석기에 그대로 넣을 수 있다.
		"-Xlog:gc*,safepoint:file=${outDir}/gc-${gcName}-${stamp}.log:time,uptime,level,tags"
	])
	systemProperty 'spring.profiles.active', 'test,loadtest'
}

// DbBackpressureLoadTest 전용 JFR 진단 태스크.
// jdk.VirtualThreadPinned 이벤트 관찰 목적 (pgjdbc synchronized 블록 pinning 확인).
// 별도 태스크로 분리해 기본 test 태스크(다른 모든 테스트)에는 영향 없음.
// 임시 진단용, 확인 끝나면 이 태스크는 제거 예정.
tasks.register('dbBackpressureJfrTest', Test) {
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching 'com.codescope.infra.config.DbBackpressureLoadTest'
	}
	// threshold=0ms: profile.jfc 기본값(20ms)으로는 짧은 pinning이 누락될 수 있어 하향 조정.
	jvmArgs(
		'-XX:StartFlightRecording=filename=build/pinning.jfr,settings=profile,jdk.VirtualThreadPinned#threshold=0ms',
		// application.yaml의 show-sql/org.hibernate.SQL 로깅(println/synchronized 경로)이
		// pinning 원인의 노이즈였는지 격리하기 위해, 이 태스크 실행 시점에만 System property로
		// 끈다. application.yaml(프로덕션 설정) 자체는 건드리지 않음.
		'-Dspring.jpa.show-sql=false',
		'-Dlogging.level.org.hibernate.SQL=WARN'
	)
}